<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="card">
      <rect x="252" y="152" width="520" height="680" rx="48"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#141414"/>

  <!-- Card shadow -->
  <rect x="252" y="152" width="520" height="680" rx="48" fill="#000" opacity="0.4" filter="url(#shadow)"/>

  <!-- Card base (clipped) -->
  <g clip-path="url(#card)">
    <!-- Card background -->
    <rect x="252" y="152" width="520" height="680" fill="#F7F7F4"/>

    <!-- Header stripe -->
    <rect x="252" y="152" width="520" height="10" fill="#E8E8E4"/>

    <!-- Dark total footer -->
    <rect x="252" y="672" width="520" height="160" fill="#1a1a1a"/>
  </g>

  <!-- Card border -->
  <rect x="252" y="152" width="520" height="680" rx="48" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>

  <!-- Entry rows: label pill + amount pill -->
  <!-- Row 1 -->
  <rect x="312" y="268" width="212" height="20" rx="10" fill="#D4D4CF"/>
  <rect x="580" y="268" width="120" height="20" rx="10" fill="#D4D4CF"/>

  <!-- Row 2 -->
  <rect x="312" y="332" width="176" height="20" rx="10" fill="#DCDCD8"/>
  <rect x="580" y="332" width="100" height="20" rx="10" fill="#DCDCD8"/>

  <!-- Row 3 -->
  <rect x="312" y="396" width="196" height="20" rx="10" fill="#D4D4CF"/>
  <rect x="580" y="396" width="120" height="20" rx="10" fill="#D4D4CF"/>

  <!-- Row 4 -->
  <rect x="312" y="460" width="156" height="20" rx="10" fill="#DCDCD8"/>
  <rect x="580" y="460" width="108" height="20" rx="10" fill="#DCDCD8"/>

  <!-- Divider -->
  <rect x="292" y="526" width="440" height="1.5" fill="#E4E4E0"/>

  <!-- Subtotal row -->
  <rect x="312" y="558" width="108" height="18" rx="9" fill="#C8C8C4"/>
  <rect x="548" y="553" width="152" height="28" rx="14" fill="#C0C0BC"/>

  <!-- Total section (on dark footer) -->
  <!-- "Total" label -->
  <rect x="312" y="708" width="96" height="20" rx="10" fill="rgba(255,255,255,0.3)"/>
  <!-- Amount highlight -->
  <rect x="488" y="700" width="212" height="36" rx="18" fill="rgba(255,255,255,0.95)"/>

  <!-- Tiny sparkline on footer -->
  <polyline
    points="312,782 356,764 400,770 456,748 512,736 568,720 620,708 680,696"
    stroke="rgba(255,255,255,0.25)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
